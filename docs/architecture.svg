<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>PrivaSVG architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Everything runs inside the browser tab. There is no backend; the model is downloaded once and cached.</text>

  <rect x="20" y="76" width="920" height="270" rx="12" fill="#ffffff" stroke="#0b5e3b" stroke-dasharray="6 4"/>
  <text x="36" y="98" font-size="12" font-weight="700" fill="#0b5e3b">YOUR BROWSER (client-side only)</text>

  <rect x="40" y="170" width="120" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="100" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Raster image</text>
  <text x="100" y="219" text-anchor="middle" font-size="11" fill="#64748b">PNG / JPG / WEBP</text>

  <rect x="190" y="120" width="190" height="170" rx="10" fill="#ecfdf5" stroke="#0b5e3b"/>
  <text x="285" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#0b5e3b">Web UI (JavaScript)</text>
  <text x="285" y="164" text-anchor="middle" font-size="11" fill="#334155">app/www/index.js</text>
  <text x="285" y="190" text-anchor="middle" font-size="11" fill="#334155">canvas · retouch brush</text>
  <text x="285" y="210" text-anchor="middle" font-size="11" fill="#334155">2x / 4x canvas upscale</text>
  <text x="285" y="230" text-anchor="middle" font-size="11" fill="#334155">tick loop driving the tracer</text>
  <text x="285" y="250" text-anchor="middle" font-size="11" fill="#334155">bulk.js: up to 50 images + ZIP</text>

  <rect x="450" y="112" width="210" height="76" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="555" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Background removal</text>
  <text x="555" y="158" text-anchor="middle" font-size="11" fill="#334155">@imgly/background-removal</text>
  <text x="555" y="174" text-anchor="middle" font-size="11" fill="#334155">isnet_fp16 on ONNX Runtime Web</text>

  <rect x="450" y="222" width="210" height="76" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="555" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Vectorizer (Rust to WASM)</text>
  <text x="555" y="268" text-anchor="middle" font-size="11" fill="#334155">ColorImageConverter</text>
  <text x="555" y="284" text-anchor="middle" font-size="11" fill="#334155">BinaryImageConverter (VTracer)</text>

  <rect x="740" y="170" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="830" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">SVG output</text>
  <text x="830" y="219" text-anchor="middle" font-size="11" fill="#64748b">SVG, PNG, or bulk ZIP</text>

  <line x1="160" y1="205" x2="188" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="170" x2="448" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="448" y1="170" x2="380" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="240" x2="448" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="260" x2="738" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <text x="414" y="132" text-anchor="middle" font-size="10" fill="#64748b">PNG blob</text>
  <text x="414" y="204" text-anchor="middle" font-size="10" fill="#64748b">cutout PNG</text>
  <text x="414" y="262" text-anchor="middle" font-size="10" fill="#64748b">pixels</text>

  <rect x="190" y="366" width="580" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Only network use: first-time model download (then cached)</text>
  <text x="480" y="404" text-anchor="middle" font-size="11" fill="#64748b">Your images are never uploaded.</text>
  <line x1="555" y1="188" x2="555" y2="196" stroke="none"/>
  <line x1="480" y1="346" x2="480" y2="364" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
