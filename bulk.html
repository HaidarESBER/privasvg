<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Processing — PrivaSVG</title>
    <script>
    (function () {
        try {
            var t = localStorage.getItem('privasvg-theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    })();
    </script>
    <style>
        :root {
            --cream: #f2f0e7;
            --cream-2: #eceadd;
            --paper: #f8f7ef;
            --paper-2: #fbfaf4;
            --ink: #18211b;
            --ink-soft: #2c362f;
            --green: #0b5e3b;
            --green-deep: #094c30;
            --muted: #54605a;
            --faint: #8a9088;
            --line: rgba(23, 32, 26, 0.13);
            --line-2: rgba(23, 32, 26, 0.22);
            --warn: #9a6b1e;
            --radius: 8px;
            --radius-sm: 5px;
            --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
            --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Menlo, Consolas, monospace;
            --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color-scheme: light;
        }
        :root[data-theme="dark"] {
            --cream: #10130d;
            --cream-2: #1e231a;
            --paper: #171b13;
            --paper-2: #1c211a;
            --ink: #ecead9;
            --ink-soft: #d1cfc0;
            --green: #7fd6a6;
            --green-deep: #93e0b6;
            --muted: #9aa48f;
            --faint: #6f7a6c;
            --line: rgba(236, 234, 217, 0.1);
            --line-2: rgba(236, 234, 217, 0.19);
            --warn: #dbb46c;
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--sans);
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.6;
            padding: 1.6rem;
            -webkit-font-smoothing: antialiased;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .container { max-width: 1000px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1.1rem 1.4rem;
            background: var(--paper);
            border: 1px solid var(--line-2);
            border-radius: var(--radius);
            margin-bottom: 1.4rem;
        }
        .header h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.5rem;
            color: var(--ink);
        }
        .header h1 .wm-accent { color: var(--green); font-style: italic; }
        .header-right { display: flex; align-items: center; gap: 0.7rem; }
        .back-link {
            text-decoration: none;
            color: var(--ink-soft);
            font-family: var(--mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.5rem 1rem;
            border: 1px solid var(--line-2);
            border-radius: var(--radius-sm);
            transition: border-color 0.14s, color 0.14s;
        }
        .back-link:hover { border-color: var(--green); color: var(--green); }
        .theme-toggle {
            width: 2rem; height: 2rem;
            display: grid; place-items: center;
            border: 1px solid var(--line-2);
            border-radius: 50%;
            background: var(--paper);
            color: var(--ink-soft);
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s, transform 0.13s;
        }
        .theme-toggle:hover { border-color: var(--green); color: var(--green); transform: rotate(-12deg); }
        .theme-toggle svg { width: 15px; height: 15px; }
        .theme-toggle .icon-moon { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

        .main-card {
            background: var(--paper);
            border: 1px solid var(--line-2);
            border-radius: var(--radius);
            padding: 2rem;
        }

        /* Pipeline */
        .pipeline-info {
            background: var(--cream-2);
            border-radius: var(--radius);
            padding: 1.3rem;
            margin-bottom: 1.6rem;
        }
        .pipeline-info h3 {
            font-family: var(--mono);
            font-size: 0.66rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--faint);
            margin-bottom: 1rem;
        }
        .pipeline-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .step {
            background: var(--paper-2);
            border: 1px solid var(--line-2);
            padding: 0.6rem 0.85rem;
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--ink-soft);
        }
        .arrow { color: var(--faint); font-family: var(--mono); font-size: 1rem; }

        /* Drop zone */
        .drop-zone {
            border: 1px dashed var(--line-2);
            border-radius: var(--radius);
            padding: 3.2rem 2rem;
            text-align: center;
            background: var(--paper-2);
            transition: border-color 0.15s, background 0.15s;
            cursor: pointer;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--green);
            background: rgba(11, 94, 59, 0.05);
        }
        .drop-zone h2 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.5rem;
            color: var(--ink);
            margin-bottom: 0.6rem;
        }
        .drop-zone p { color: var(--muted); font-size: 0.95rem; margin: 0.3rem 0; }
        .drop-zone p.drop-sub {
            font-family: var(--mono);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--faint);
            margin-top: 0.9rem;
        }
        .file-input { display: none; }

        /* Files list */
        .files-list { margin-top: 1.8rem; display: none; }
        .file-item {
            background: var(--paper-2);
            border: 1px solid var(--line);
            padding: 1.1rem 1.2rem;
            margin-bottom: 0.8rem;
            border-radius: var(--radius);
            animation: fadeUp 0.25s ease both;
        }
        .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.6rem;
        }
        .file-name { font-weight: 600; color: var(--ink); font-size: 0.92rem; word-break: break-all; }
        .file-status {
            flex: 0 0 auto;
            font-family: var(--mono);
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.22rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid currentColor;
        }
        .status-pending { color: var(--faint); }
        .status-processing { color: var(--warn); }
        .status-complete { color: var(--green); }
        .status-error { color: var(--warn); }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: var(--cream-2);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.6rem;
        }
        .progress-fill {
            height: 100%;
            background: var(--green);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }

        /* Controls & buttons */
        .controls {
            margin-top: 1.8rem;
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.72rem 1.6rem;
            border: 1px solid var(--line-2);
            border-radius: var(--radius);
            background: transparent;
            color: var(--ink-soft);
            font-family: var(--sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.14s, border-color 0.14s, color 0.14s, transform 0.1s;
        }
        .btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); background: rgba(11, 94, 59, 0.05); }
        .btn:active:not(:disabled) { transform: scale(0.99); }
        .btn:disabled { opacity: 0.45; cursor: default; }
        .btn-primary, .btn-success {
            background: var(--green);
            border-color: var(--green);
            color: var(--cream);
        }
        .btn-primary:hover:not(:disabled), .btn-success:hover:not(:disabled) {
            background: var(--green-deep);
            border-color: var(--green-deep);
            color: var(--cream);
        }
        :root[data-theme="dark"] .btn-primary, :root[data-theme="dark"] .btn-success { color: #10130d; }
        .btn-danger { color: var(--warn); }
        .btn-danger:hover:not(:disabled) { border-color: var(--warn); color: var(--warn); background: rgba(154, 107, 30, 0.06); }

        /* Summary */
        .summary {
            background: var(--cream-2);
            border: 1px solid var(--line-2);
            border-left: 3px solid var(--green);
            padding: 1.6rem;
            border-radius: var(--radius);
            margin-top: 1.8rem;
            text-align: center;
            display: none;
        }
        .summary h3 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.5rem;
            color: var(--ink);
            margin-bottom: 0.6rem;
        }
        .summary p { font-size: 1rem; color: var(--muted); }

        .loading {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid var(--line-2);
            border-radius: 50%;
            border-top-color: var(--green);
            animation: spin 0.7s linear infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bulk Processing <span class="wm-accent">Pipeline</span></h1>
            <div class="header-right">
                <a href="index.html" class="back-link">Back</a>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
            </div>
        </div>

        <div class="main-card">
            <div class="pipeline-info">
                <h3>Automated processing pipeline</h3>
                <div class="pipeline-steps">
                    <div class="step">Upload</div>
                    <span class="arrow">&rarr;</span>
                    <div class="step">Upscale 2x</div>
                    <span class="arrow">&rarr;</span>
                    <div class="step">Remove BG</div>
                    <span class="arrow">&rarr;</span>
                    <div class="step">Vectorize</div>
                    <span class="arrow">&rarr;</span>
                    <div class="step">SVG to JPEG</div>
                    <span class="arrow">&rarr;</span>
                    <div class="step">ZIP</div>
                </div>
            </div>

            <div class="drop-zone" id="dropZone">
                <h2>Drop multiple images here</h2>
                <p>or click to select files</p>
                <p class="drop-sub">PNG · JPG · WEBP · Up to 50 images · Processed on your device</p>
                <input type="file" id="fileInput" class="file-input" multiple accept="image/*">
            </div>

            <div class="files-list" id="filesList"></div>

            <div class="controls" id="controls" style="display: none;">
                <button class="btn btn-primary" id="processBtn">
                    <span>Start Processing</span>
                </button>
                <button class="btn btn-danger" id="clearBtn">
                    <span>Clear All</span>
                </button>
            </div>

            <div class="summary" id="summary">
                <h3>Processing complete</h3>
                <p id="summaryText"></p>
                <button class="btn btn-success" id="downloadBtn" style="margin: 1.2rem auto 0;">
                    <span>Download ZIP</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
            var root = document.documentElement;
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('privasvg-theme', next); } catch (e) {}
        });
    })();
    </script>
    <script src="bulk.bundle.js"></script>
</body>
</html>
